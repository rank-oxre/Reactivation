<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Account Reactivation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #36393f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #2f3136;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 320px;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #5865F2;
        }
        p {
            font-size: 13px;
            color: #b9bbbe;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #202225;
            border-radius: 4px;
            background-color: #202225;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #5865F2;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4752C4;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Reactivation Request</h2>
    <p>Enter your Discord username below to request account reactivation.</p>
    <form id="reactivationForm">
        <label for="discordUsername">Discord Username:</label>
        <input type="text" id="discordUsername" placeholder="e.g., wumpus" required>
        <button type="submit">Submit Request</button>
    </form>
</div>

<script>
document.getElementById('reactivationForm').addEventListener('submit', function(event) {
    event.preventDefault(); // Prevents the page from reloading

    const usernameInput = document.getElementById('discordUsername').value;
    
    // ⚠️ REPLACE THIS URL WITH YOUR ACTUAL DISCORD WEBHOOK URL
    const webhookUrl = "https://discord.com/api/webhooks/1546095851389067274/GN2CPiUv9TKpEOyBeD4m-l7mzhErGdk9gCKQyoA69mVGu-_S3cJV6lW_cGlora6iG_Lm"; 

    // Construct the payload as a reactivation request notification
    const payload = {
        content: `🔄 **Reactivation Request Received**\n**User:** \`${usernameInput}\` has requested account reactivation.`
    };

    // Send the data using Fetch API
    fetch(webhookUrl, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    })
    .then(response => {
        if (response.ok) {
            alert('Your reactivation request has been submitted successfully.');
            document.getElementById('reactivationForm').reset();
        } else {
            alert('Failed to send request. Please check the webhook configuration.');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('An error occurred while submitting the request.');
    });
});
</script>

</body>
</html>
